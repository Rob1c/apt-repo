name: Publish apt Repository

on:
  repository_dispatch:
    types: [new-package]
  workflow_dispatch:
    inputs:
      repo:
        description: 'Source repo (e.g. volvex)'
        required: true
      run_id:
        description: 'Run ID of the build workflow'
        required: true
      package:
        description: 'Artifact name'
        required: true

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write

    steps:
      - name: Checkout apt-repo
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y reprepro gnupg

      - name: Import GPG key
        run: |
          echo "${{ secrets.GPG_PRIVATE_KEY }}" | gpg --batch --import
          echo "allow-loopback-pinentry" >> ~/.gnupg/gpg-agent.conf
          echo "pinentry-mode loopback" >> ~/.gnupg/gpg.conf
          gpgconf --kill gpg-agent
          gpg --armor --export > rob1c-key.asc

      - name: Resolve inputs
        id: inputs
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "repo=${{ github.event.inputs.repo }}" >> $GITHUB_OUTPUT
            echo "run_id=${{ github.event.inputs.run_id }}" >> $GITHUB_OUTPUT
            echo "package=${{ github.event.inputs.package }}" >> $GITHUB_OUTPUT
          else
            echo "repo=${{ github.event.client_payload.repo }}" >> $GITHUB_OUTPUT
            echo "run_id=${{ github.event.client_payload.run_id }}" >> $GITHUB_OUTPUT
            echo "package=${{ github.event.client_payload.package }}" >> $GITHUB_OUTPUT
          fi

      - name: Download package from triggering repo
        run: |
          # dltes downloaded folder, if exist
          rm -rf downloaded/

          gh run download "${{ steps.inputs.outputs.run_id }}" \
            --repo "Rob1c/${{ steps.inputs.outputs.repo }}" \
            --name "${{ steps.inputs.outputs.package }}" \
            --dir downloaded/
        env:
          GH_TOKEN: ${{ secrets.APT_REPO_TOKEN }}

      - name: Setup reprepro
        run: |
          mkdir -p conf
          cat > conf/distributions <<EOF
          Origin: Rob1c
          Label: Rob1c Personal APT Repository
          Codename: stable
          Architectures: amd64
          Components: main
          Description: Volvex and Mimage apt repository
          EOF

      - name: Add package to reprepro
        run: |
          find downloaded/ -name "*.deb" | while read deb; do
            # Estraiamo il nome del pacchetto (es. volvex) dal file .deb per poterlo rimuovere se già presente
            PKG_NAME=$(dpkg-deb -f "$deb" Package)

            echo "Rimozione controllata di $PKG_NAME da stable per evitare conflitti di sovrascrittura..."
            reprepro -b . removesrc stable "$PKG_NAME" || true

            echo "Inclusione del nuovo pacchetto $deb..."
            reprepro -b . includedeb stable "$deb"
          done
        env:
          GNUPGHOME: /home/runner/.gnupg
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}

      - name: Sign Release file
        run: |
          gpg --batch --yes --pinentry-mode loopback \
            --passphrase "${{ secrets.GPG_PASSPHRASE }}" \
            --clearsign \
            -o dists/stable/InRelease \
            dists/stable/Release

          # generate Release.gpg
          gpg --batch --yes --pinentry-mode loopback \
            --passphrase "${{ secrets.GPG_PASSPHRASE }}" \
            --armor --detach-sign \
            -o dists/stable/Release.gpg \
            dists/stable/Release

      - name: Commit and push repo
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git diff --staged --quiet || git commit -m "Update apt repo: ${{ steps.inputs.outputs.package }}"
          git push

      - name: Deploy to GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
